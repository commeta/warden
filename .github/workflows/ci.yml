name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test & lint (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (as root — exercises procfs, pidfd, fanotify, the end-to-end daemon test)
        run: sudo -E env "PATH=$PATH" cargo test --workspace --locked

  # Known-vulnerable dependencies and unused ones fail the build: both used to
  # surface only in a manual review.
  dependencies:
    name: dependencies (audit, unused)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit cargo-machete --locked
      - run: cargo audit --deny warnings
      - run: cargo machete

  # Install and run the real systemd unit. This is the test that catches
  # sandboxing mistakes (seccomp filter, capabilities, paths) that unit tests
  # cannot see — e.g. a syscall missing from SystemCallFilter killing the
  # daemon with SIGSYS on start.
  service:
    name: systemd service smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace nftables
      - run: cargo build --release --locked -p wardend -p wardenctl
      - name: Seccomp filter covers every syscall the daemon uses
        run: |
          sudo -E env "PATH=$PATH" bash -lc 'cd "$GITHUB_WORKSPACE" && bash ./scripts/check-seccomp.sh ./target/release/wardend 20'
      - name: Install (dry-run) and start the unit
        run: |
          sudo mkdir -p /var/www/html && echo '<?php echo 1;' | sudo tee /var/www/html/index.php >/dev/null
          sudo -E env "PATH=$PATH" bash -lc 'cd "$GITHUB_WORKSPACE" && ./scripts/install.sh --no-build --profile webserver --enable --start'
      - name: Service stays up and healthy
        run: |
          sleep 45
          systemctl is-active wardend
          test "$(systemctl show wardend -p NRestarts --value)" = "0"
          ! journalctl -u wardend --no-pager | grep -E "core-dump|SIGSYS|status=31"
          curl -fsS http://127.0.0.1:9184/health
          sudo wardenctl status
          sudo wardenctl doctor
      - name: Detects a webshell through the running service
        run: |
          echo '<?php @eval(base64_decode($_POST["x"])); ?>' | sudo tee /var/www/html/shell.php >/dev/null
          for i in $(seq 1 30); do
            sudo wardenctl events -n 200 | grep -q "security.webshell" && exit 0
            sleep 2
          done
          sudo wardenctl events -n 200; exit 1
      - name: Logs on failure
        if: failure()
        run: |
          sudo systemctl status wardend --no-pager || true
          sudo journalctl -u wardend -n 200 --no-pager || true

  # Coverage on every push and pull request: the number is in the job
  # summary (and a comment on pull requests from this repository), the build
  # fails below the floor in .github/coverage-floor or when it falls more
  # than half a point below main's last measurement.
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure (as root, like the test job)
        run: |
          sudo -E env "PATH=$PATH" cargo llvm-cov --workspace --locked --no-report
          sudo -E env "PATH=$PATH" cargo llvm-cov report --json --summary-only --output-path cov.json
          sudo -E env "PATH=$PATH" cargo llvm-cov report --summary-only > cov.txt
          sudo chown -R "$(id -u):$(id -g)" target cov.json cov.txt
      - name: Coverage of main (baseline)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: coverage-main.txt
          key: coverage-main-${{ github.sha }}
          restore-keys: coverage-main-
      - name: Floor and no decrease
        run: |
          pct=$(jq -r '.data[0].totals.lines.percent | . * 100 | round / 100' cov.json)
          floor=$(tr -d ' \n' < .github/coverage-floor)
          base=$(cat coverage-main.txt 2>/dev/null || true)
          {
            echo "### Line coverage: ${pct}%"
            echo
            echo "floor ${floor}%${base:+ · main ${base}%}"
            echo
            echo "<details><summary>per file</summary>"
            echo
            echo '```'
            cat cov.txt
            echo '```'
            echo "</details>"
          } | tee comment.md >> "$GITHUB_STEP_SUMMARY"
          ok=1
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p + 0 >= f + 0) }' ||
            { echo "::error::line coverage ${pct}% is below the floor ${floor}% (.github/coverage-floor)"; ok=0; }
          if [ -n "$base" ]; then
            awk -v p="$pct" -v b="$base" 'BEGIN { exit !(p + 0 >= b - 0.5) }' ||
              { echo "::error::line coverage fell from ${base}% (main) to ${pct}%"; ok=0; }
          fi
          echo "$pct" > coverage-main.txt
          [ "$ok" = 1 ]
      - name: Remember main's coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: coverage-main.txt
          key: coverage-main-${{ github.sha }}
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f comment.md ] || exit 0
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body-file comment.md ||
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            cov.json
            cov.txt

  # The parsers of untrusted input under libFuzzer, one minute each
  # (crates/warden-fuzz holds the bodies; `cargo test` runs them on stable
  # too). A crash uploads the input that caused it.
  fuzz:
    name: fuzz smoke (cargo-fuzz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Every target for 60 s
        working-directory: fuzz
        run: |
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -max_len=8192 -rss_limit_mb=1024 -timeout=10
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Release packages are linked on the oldest supported base (Ubuntu 22.04,
  # glibc 2.35): built on 24.04 the binaries need GLIBC_2.39 and do not start
  # on Debian 12 or Ubuntu 22.04 (see scripts/check-glibc.sh).
  package:
    name: build .deb (on Ubuntu 22.04)
    runs-on: ubuntu-22.04
    needs: [test, service, dependencies]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo build --release --locked -p wardend -p wardenctl
      - name: The binaries need at most glibc 2.34
        run: ./scripts/check-glibc.sh target/release/wardend target/release/wardenctl
      - run: cargo deb -p wardend --no-build
      - name: Install the package and start it (real systemd)
        run: |
          dpkg-deb -f target/debian/*.deb Depends | tee /dev/stderr | grep -q 'libc6 (>= 2.3[45])'
          sudo apt-get install -y ./target/debian/*.deb
          # a fresh install observes only, and does not come back by itself after a reboot
          grep -q '^dry_run = true' /etc/warden/warden.toml
          ! systemctl is-enabled --quiet wardend
          sudo systemctl start wardend && sleep 15 && systemctl is-active wardend
          sudo wardenctl status | grep -qi "dry"
          # reload validates first: a broken configuration fails the reload, the daemon keeps running
          echo 'this is not toml' | sudo tee /etc/warden/conf.d/99-broken.toml >/dev/null
          ! sudo systemctl reload wardend
          systemctl is-active wardend
          sudo rm /etc/warden/conf.d/99-broken.toml && sudo systemctl reload wardend
      - uses: actions/upload-artifact@v4
        with:
          name: warden-deb
          path: target/debian/*.deb

  # The package on every supported release, in a clean container: installs,
  # validates with every profile, starts, answers /health and the control
  # socket, stops cleanly, and purge keeps the operator's files.
  install:
    name: install on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: package
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: warden-deb
          path: deb
      - run: ./scripts/test-deb-install.sh deb/*.deb
