# Warden Lab Kit — minimal mod_security2 module config.
# The kit configures ModSecurity entirely through
# /etc/apache2/conf-enabled/warden-lab.conf, so the distro's default includes
# (/etc/modsecurity/*.conf and /usr/share/modsecurity-crs/*.load) are
# intentionally NOT loaded here — loading the CRS twice would error on
# duplicate rule IDs. The original was moved aside by labctl.
<IfModule security2_module>
    SecDataDir /var/cache/modsecurity
</IfModule>
