# Warden Lab Kit — nginx front (included inside the distro http{} block).
# A combined log format with the real client IP (behind an edge proxy
# real_ip_header rewrites $remote_addr, so access logs name the true source
# Warden correlates on).
log_format labcombined '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

@SERVERS@
