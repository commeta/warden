# Warden Lab Kit — HAProxy edge in front of the nginx + ModSecurity 3 tier.
# TLS terminates here; the real client address is forwarded so the WAF tier
# (and Warden) see the true source, not HAProxy's.
global
    log /dev/log local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
defaults
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s
frontend fe_http
    bind :80
    bind :443 ssl crt @PEM@
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http  if !{ ssl_fc }
    default_backend be_waf
backend be_waf
    server waf 127.0.0.1:8080 check
