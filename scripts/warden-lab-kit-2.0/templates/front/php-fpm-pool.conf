; Warden Lab Kit — PHP-FPM pool "@NAME@".
; Its own user and socket so a webshell is attributed to this site's account,
; and so Warden sees a realistic per-site shared-hosting layout. The process
; group is www-data so the web server can read what this pool writes.
[@NAME@]
user = @RUNUSER@
group = www-data
listen = @SOCK@
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500
; hardening: no dangerous functions, errors to the lab log only
php_admin_value[disable_functions] = dl,pcntl_exec
php_admin_value[error_log] = /var/log/warden-lab/php-@NAME@.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[open_basedir] = @BASE@:/tmp:/etc/warden-lab
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 16M
