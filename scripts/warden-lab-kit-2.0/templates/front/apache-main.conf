# Warden Lab Kit — Apache front with mod_security2.
# ModSecurity's base and the CRS are loaded ONCE here, at server scope:
# directives such as SecDataDir/SecTmpDir are not allowed inside <VirtualHost>.
# Each vhost below only overrides the per-site audit log (which IS allowed in a
# vhost), so the `site` field in Warden's events is still per-site.
<IfModule security2_module>
    SecRuleEngine On
    Include @MODSEC_MAIN@
</IfModule>

@VHOSTS@
