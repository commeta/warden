<VirtualHost *:80>
    ServerName @SERVER_NAME@
    @ALIASES@
    DocumentRoot @ROOT@
    DirectoryIndex index.php index.html
    CustomLog @ACCESS_LOG@ combined
    ErrorLog @ERROR_LOG@
    LimitRequestBody 16777216

    <Directory @ROOT@>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # a webshell dropped into uploads/ is reachable (the access correlation
    # fires) but never executed — production-safe.
    <Directory @ROOT@/uploads>
        <FilesMatch "\.(php|phar|phtml|pht)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <IfModule security2_module>@PER_SITE_AUDIT@
    </IfModule>

    @PHP_BLOCK@

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

@SVC_BLOCK@
    <FilesMatch "^\.ht">
        Require all denied
    </FilesMatch>
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName @SERVER_NAME@
    @ALIASES@
    DocumentRoot @ROOT@
    DirectoryIndex index.php index.html
    CustomLog @ACCESS_LOG@ combined
    ErrorLog @ERROR_LOG@
    LimitRequestBody 16777216
    SSLEngine on
    SSLCertificateFile @CERT@
    SSLCertificateKeyFile @KEY@
    @HSTS@

    <Directory @ROOT@>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory @ROOT@/uploads>
        <FilesMatch "\.(php|phar|phtml|pht)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <IfModule security2_module>@PER_SITE_AUDIT@
    </IfModule>
    @PHP_BLOCK@
@SVC_BLOCK@
</VirtualHost>
</IfModule>
