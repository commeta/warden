# ModSecurity base configuration — rendered by the Warden Lab Kit.
# Shared by ModSecurity 2.9 (Apache) and libmodsecurity 3 (nginx connector):
# both accept these directives. The audit-log block below is what Warden reads.

# -- engine ---------------------------------------------------------------
SecRuleEngine @ENGINE@
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile unicode.mapping 20127
SecStatusEngine Off
SecDefaultAction "phase:1,log,auditlog,pass"

# -- request/response body handling errors -------------------------------
SecRule REQBODY_ERROR "!@eq 0" \
  "id:'200002',phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.'"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
  "id:'200003',phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation.'"

# -- audit log (this is the surface Warden consumes) ----------------------
@AUDIT@
