# ModSecurity rules entrypoint loaded by the front (nginx modsecurity_rules_file
# or Apache Include). Explicit Include, never IncludeOptional: on libmodsecurity 3
# a missing CRS include must be a hard error, not a silently unprotected site
# (a 0.14.2 lab finding). Order: engine/audit config, CRS setup, lab exclusions,
# then the rules.
Include @MODSEC_CONF@
Include @CRS_SETUP@
Include @EXCLUSIONS@
Include @CRS_RULES@
