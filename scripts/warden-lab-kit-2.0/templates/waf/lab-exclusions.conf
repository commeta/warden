# Lab false-positive exclusions. The emulated CMS admin screens post HTML and
# long bodies that CRS would otherwise flag; these keep a legitimate "save"
# from being blocked, so the WAF tests measure real attacks, not editor noise.
# They are scoped to the admin paths only — the public attack surface keeps
# full coverage.
SecRule REQUEST_FILENAME "@rx /(wp-admin|admin|manager|core/admin)/" \
  "id:9000100,phase:1,pass,nolog,\
   ctl:ruleRemoveTargetByTag=attack-xss;ARGS:content,\
   ctl:ruleRemoveTargetByTag=attack-rce;ARGS:content,\
   ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:content"
# The services' /echo endpoint intentionally reflects input for XSS probes; do
# not strip rules there — it is a target, not an exclusion.
