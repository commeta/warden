# CRS setup — rendered by the Warden Lab Kit.
# Sets paranoia and anomaly thresholds for both CRS 3.3 and CRS 4.x (variable
# names differ between the lines; the unused ones are harmless). Anomaly
# scoring is the default mode: rule 949110 (inbound) and 959100/980130
# (outbound/summary) are what Warden parses for the event headline.
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=@PARANOIA@,\
   setvar:tx.blocking_paranoia_level=@PARANOIA@,\
   setvar:tx.detection_paranoia_level=@PARANOIA@,\
   setvar:tx.inbound_anomaly_score_threshold=@ANOMALY_IN@,\
   setvar:tx.outbound_anomaly_score_threshold=@ANOMALY_OUT@"

SecAction \
  "id:900990,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.crs_setup_version=339"
